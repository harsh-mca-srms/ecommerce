version: "3.8"

services:

  user-service:
    build: ./user_service
    container_name: user-service
    ports:
      - "8001:8001"

  product-service:
    build: ./product_service
    container_name: product-service
    ports:
      - "8002:8002"

  cart-service:
    build: ./cart_service
    container_name: cart-service
    ports:
      - "8003:8003"
    depends_on:
      - user-service
      - product-service

  order-service:
    build: ./order_service
    container_name: order-service
    ports:
      - "8004:8004"
    depends_on:
      - cart-service
  frontend:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "8090:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - product-service
      - cart-service
      - order-service

  victoria:
    image: victoriametrics/victoria-metrics
    container_name: victoria
    ports:
      - "8428:8428"
    volumes:
      - victoria-data:/victoria-metrics-data
    restart: unless-stopped

  vmagent:
    image: victoriametrics/vmagent
    container_name: vmagent
    ports:
      - "8429:8429"
    volumes:
      - ./scrape.yaml:/etc/vmagent/scrape.yml
    command:
      - "-promscrape.config=/etc/vmagent/scrape.yml"
      - "-promscrape.dropOriginalLabels=false"
      - "-remoteWrite.url=http://victoria:8428/api/v1/write"
    depends_on:
      - victoria
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - victoria

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8010:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

volumes:
  victoria-data:
